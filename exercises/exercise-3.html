<!<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Assignment 3</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
                <style>
      /* Add your .content styles here. */
                    
                    #site-header {
                                margin: 0 auto; 
                                border: 1px solid #000000; 
                                background-color: white;
                                box-sizing: border-box; 
                                padding: 20px;}
                    main { padding: 20px; }
                    .row { width: 1440px; display: flex; margin: 0 auto; height: 100px; }
                    #content {width: 1440px; margin: 0 auto; background-color: white; padding: 15px; border-radius: 10px; }
                    .col-100 { background-color: white; flex: 1; border: 1px solid #000000; padding: 20px; text-align: center;}
                    .col-50 { background-color: white; flex: 0 1 50%; border: 1px solid #000000; padding: 20px; text-align: center;}
                    .col-33 { background-color: white; flex: 0 1 33.33%; border: 1px solid #000000; padding: 20px;text-align: center; }
                    .col-a { background-color: white; flex: 1; border: 1px solid #000000; padding: 20px;text-align: center;}
                    .col-b {background-color: white; flex: 0 0 200px; border: 1px solid #000000; padding: 20px;text-align: center;}
                    footer { background-color: white; flex: 1; width: 1440px; margin: 0 auto; border: 1px solid #000000; text-align: center; }
                    body {background-color: #444445;}
                </style>
  </head>
  <body>
    <header id="site-header">
      <div class="row">
        <div class="col-100">
          header: col-100<br />This entire layout is 1440px wide
        </div>
      </div>
    </header>
    <main>
      <div id="content">
        <div class="row">
          <div class="col-a">col-a</div>
          <div class="col-b">col-b<br />(width 200px)</div>
        </div>

        <div class="row">
          <div class="col-50">col-50</div>
          <div class="col-50">col-50</div>
        </div>

        <div class="row">
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
        </div>

        <footer>
        <div class="row">
          <div class="col-100">footer: col-100</div>
        </div>
      </footer>
      
      </div>

    </main>
  </body>
</html>
